<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxa | Gestión de tareas</title>
    <!-- conexion a bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
</head>

<body>

    <!-- ===== Header ===== -->
    <header class="border-bottom">

        <div class="container-fluid py-3">

            <div class="d-flex align-items-center">

                <!-- Logo -->
                <a href="#" class="text-decoration-none">
                    <img src="assets/img/fluxa-logo.svg" alt="Fluxa - Gestión de tareas" height="50">
                </a>

            </div>

        </div>

    </header>

    <!-- ===== Contenido Principal ===== -->
    <main>
        <div class="container-fluid">

            <div class="row">

                <!-- ===== Sidebar ===== -->
                <aside class="col-12 col-lg-3">

                    <!-- Nueva tarea -->

                    <!-- Navegación -->

                    <!-- Proyectos -->

                    <!-- Tarjeta inferior -->


                </aside>

                <!-- ===== Contenido ===== -->
                <section class="col-12 col-lg-9">

                    <!-- ===== Encabezado del Dashboard ===== -->
                    <header class="mb-4">

                        <!-- Título principal -->
                        <h1>
                            Buenos días, Miguel 👋
                        </h1>

                        <!-- Descripción -->
                        <p>
                            Aquí tienes un resumen de tus tareas de hoy.
                        </p>

                    </header>

                    <!-- ===== Estadísticas ===== -->
                    <section aria-labelledby="statistics-title">

                        <h2 id="statistics-title" class="visually-hidden">
                            Estadísticas de tareas
                        </h2>

                        <div class="row g-3">

                            <!-- Tareas pendientes -->
                            <div class="col-12 col-sm-6 col-xl-3">

                                <div class="card h-100">

                                    <div class="card-body">

                                        <p class="display-6 fw-bold mb-1">
                                            12
                                        </p>

                                        <p class="card-text">
                                            Tareas pendientes
                                        </p>

                                    </div>

                                </div>

                            </div>


                            <!-- Tareas en progreso -->
                            <div class="col-12 col-sm-6 col-xl-3">

                                <div class="card h-100">

                                    <div class="card-body">

                                        <p class="display-6 fw-bold mb-1">
                                            5
                                        </p>

                                        <p class="card-text">
                                            En progreso
                                        </p>

                                    </div>

                                </div>

                            </div>


                            <!-- Tareas completadas -->
                            <div class="col-12 col-sm-6 col-xl-3">

                                <div class="card h-100">

                                    <div class="card-body">

                                        <p class="display-6 fw-bold mb-1">
                                            24
                                        </p>

                                        <p class="card-text">
                                            Completadas
                                        </p>

                                    </div>

                                </div>

                            </div>


                            <!-- Tareas vencidas -->
                            <div class="col-12 col-sm-6 col-xl-3">

                                <div class="card h-100">

                                    <div class="card-body">

                                        <p class="display-6 fw-bold mb-1">
                                            2
                                        </p>

                                        <p class="card-text">
                                            Vencidas
                                        </p>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </section>


                </section>

                <!-- ===== Sección de tareas ===== -->
                <section class="mt-5" aria-labelledby="tasks-title">

                    <!-- Encabezado de la sección -->
                    <header class="d-flex justify-content-between align-items-center mb-3">

                        <!-- Título -->
                        <h2 id="tasks-title" class="h4 mb-0">
                            Mis tareas
                        </h2>

                        <!-- Enlace para ver todas las tareas -->
                        <a href="#" class="text-decoration-none">
                            Ver todas →
                        </a>

                    </header>

                </section>






                

            </div>


        </div>
    </main>
    <!-- ===== Conexión a bootstrap ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
